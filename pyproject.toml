[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "celvo"
version = "1.3.0"
description = "Private offline speech transcription tool"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "platformdirs>=4,<5",
    "Send2Trash>=1.8,<2",
    "sounddevice>=0.4.6,<1",
    "PyAudioWPatch==0.2.12.9; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
celvo = "celvo.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
