name: Python CI

on:
  push:
    branches: [main, windows11-production-ready]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev python3-tk
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      - name: Compile, import, test, and lint
        run: |
          python -m compileall -q celvo
          python -c "import celvo; import celvo.core.audio; import celvo.core.mixer; import celvo.core.whisper; import tkinter"
          python -m pytest
          python -m ruff check celvo tests
